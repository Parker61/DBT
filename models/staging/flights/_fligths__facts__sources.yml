sources:
  - name: demo_src
    schema: demo_src
    description: "Основные фактовые таблицы авиабазы"
    tables:
      - name: boarding_passes
        description: "Посадочные талоны, выданные пассажирам"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: flight_id
            description: "ID рейса"
          - name: boarding_no
            description: "Порядковый номер посадки"
          - name: seat_no
            description: "Место в самолёте"
      - name: flights
        description: "Рейсы авиакомпании"
        columns:
          - name: flight_id
            description: "ID рейса (уникальный идентификатор)"
          - name: flight_no
            description: "Номер рейса"
          - name: scheduled_departure
            description: "Плановое время вылета"
          - name: actual_departure
            description: "Фактическое время вылета"
        freshness:
          warn_after: { count: 10000, period: day }
          error_after: { count: 10000, period: day }
        loaded_at_field: actual_departure::timestamp
      - name: ticket_flights
        description: "Связь билетов и рейсов"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: flight_id
            description: "ID рейса"
          - name: fare_conditions
            description: "Класс обслуживания"
          - name: amount
            description: "Стоимость билета"
      - name: tickets
        description: "Информация о билетах"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: book_ref
            description: "Номер бронирования"
          - name: passenger_id
            description: "ID пассажира"
          - name: passenger_name
            description: "Имя пассажира"
          - name: contact_data
            description: "Контактные данные"
