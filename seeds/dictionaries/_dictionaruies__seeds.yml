seeds:
  - name: id_passenger
    config:
      schema: seeds
      database: dwh_flights
      file: id_passenger.csv
      column_types:
        passenger_id: varchar(20)
      columns:
        - name: passenger_id
          tests:
            - not_null
            - unique

  - name: city_region
    description: Сопоставление регионов и городов 
    config:
      schema: seeds
      column_types:
        city: varchar(50)
        region: varchar(50)
        updated_at: timestamp
      delimiter: ";"
    columns:
      - name: city
        tests:
          - not_null
          - unique

