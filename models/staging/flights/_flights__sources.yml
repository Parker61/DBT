sources:
  - name: demo_src
    schema: demo_src
    description: "Source tables for the flights database"
    tables:
      - name: aircrafts
        description: "Aircrafts table"
        columns:
          - name: aircraft_code
            description: >
              Aircraft code
               and primary key
               <br>
            tests:
              - not_null
              - unique
          - name: model
            description: "*Aircraft model*"
          - name: "range"
            description: "_Aircraft range_"
      - name: airports
        description: "Airports table"
        columns:
          - name: airport_code
            description: "Airport code"
          - name: airport_name
            description: "Airport name"
          - name: city
            description: "City"
          - name: coordinates
            description: "Coordinates"
          - name: timezone
            description: "Timezone"
      - name: seats
        description: "Seats table"
        columns:
          - name: aircraft_code
            description: "Aircraft code"
          - name: seat_no
            description: "Seat number"
      - name: bookings
        description: "Bookings table"
        columns:
          - name: book_ref
            description: "Booking reference"
          - name: book_date
            description: "Booking date"
          - name: total_amount
            description: "Total amount"
        freshness: # make this a little more strict
          warn_after: { count: 10000, period: day }
          error_after: { count: 10000, period: day }
          filter: current_timestamp::date - book_date::date < 30000
        loaded_at_field: book_date::timestamp
      - name: boarding_passes
        description: "Посадочные талоны, выданные пассажирам"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: flight_id
            description: "ID рейса"
          - name: boarding_no
            description: "Порядковый номер посадки"
          - name: seat_no
            description: "Место в самолёте"
      - name: flights
        description: "Рейсы авиакомпании"
        columns:
          - name: flight_id
            description: "ID рейса (уникальный идентификатор)"
          - name: flight_no
            description: "Номер рейса"
          - name: scheduled_departure
            description: "Плановое время вылета"
          - name: scheduled_arrival
            description: "Плановое время прилёта"
          - name: departure_airport
            description: "Аэропорт вылета"
          - name: arrival_airport
            description: "Аэропорт прилёта"
          - name: status
            description: "Статус рейса"
          - name: aircraft_code
            description: "Код самолёта"
          - name: actual_departure
            description: "Фактическое время вылета"
          - name: actual_arrival
            description: "Фактическое время прилёта"
        freshness:
          warn_after: { count: 10000, period: day }
          error_after: { count: 10000, period: day }
        loaded_at_field: actual_departure::timestamp
      - name: ticket_flights
        description: "Связь билетов и рейсов"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: flight_id
            description: "ID рейса"
          - name: fare_conditions
            description: "Класс обслуживания"
          - name: amount
            description: "Стоимость билета"
      - name: tickets
        description: "Информация о билетах"
        columns:
          - name: ticket_no
            description: "Номер билета"
          - name: book_ref
            description: "Номер бронирования"
          - name: passenger_id
            description: "ID пассажира"
          - name: passenger_name
            description: "Имя пассажира"
          - name: contact_data
            description: "Контактные данные"
