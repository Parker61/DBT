sources:
  - name: demo_src
    schema: demo_src
    description: "Source tables for the flights database"
    tables:
      - name: aircrafts
        description: "Aircrafts table"
        columns:
          - name: aircraft_code
            description: >
              Aircraft code
               and primary key
               <br>
            tests:
              - not_null
              - unique
          - name: model
            description: "*Aircraft model*"
          - name: "range"
            description: "_Aircraft range_"
      - name: airports
        description: "Airports table"
        columns:
          - name: airport_code
            description: "Airport code"
          - name: airport_name
            description: "Airport name"
          - name: city
            description: "City"
          - name: coordinates
            description: "Coordinates"
          - name: timezone
            description: "Timezone"
      - name: seats
        description: "Seats table"
        columns:
          - name: aircraft_code
            description: "Aircraft code"
          - name: seat_no
            description: "Seat number"
      - name: bookings
        columns:
          - name: book_ref
            description: "Booking reference"
          - name: book_date
            description: "Booking date"
          - name: total_amount
            description: "Total amount"
        freshness: # make this a little more strict
          warn_after: { count: 6, period: hour }
          error_after: { count: 12, period: hour }
          filter: curent_timestamp::date - book_date::date < 30000
        loaded_at_field: book_date::timestamp
